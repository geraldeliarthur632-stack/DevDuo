<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="foxGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#ff4d00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle glowing code grid/orbit line -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.15" stroke-dasharray="16 12"/>

  <!-- Tech Fox / Cyber Mascot Head -->
  <g filter="url(#glow)">
    <!-- Fox Ears -->
    <!-- Left Ear -->
    <polygon points="150,110 110,230 200,200" fill="url(#foxGrad)"/>
    <polygon points="148,135 125,215 185,195" fill="#312e81"/>
    <polygon points="148,145 132,205 178,190" fill="#06b6d4"/>

    <!-- Right Ear -->
    <polygon points="362,110 402,230 312,200" fill="url(#foxGrad)"/>
    <polygon points="364,135 387,215 327,195" fill="#312e81"/>
    <polygon points="364,145 380,205 334,190" fill="#06b6d4"/>

    <!-- Head Base -->
    <path d="M 130 230 C 130 180, 382 180, 382 230 C 382 310, 340 370, 256 395 C 172 370, 130 310, 130 230 Z" fill="url(#foxGrad)"/>

    <!-- White/Cream Cheeks -->
    <path d="M 130 260 C 145 320, 190 355, 256 395 C 210 370, 175 330, 160 270 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 382 260 C 367 320, 322 355, 256 395 C 302 370, 337 330, 352 270 Z" fill="#ffffff" opacity="0.95"/>

    <!-- Cyber Headset / Code Visor -->
    <rect x="160" y="215" width="192" height="72" rx="28" fill="#1e1b4b" stroke="#06b6d4" stroke-width="8"/>
    
    <!-- Code Bracket Eyes in Visor: < / > -->
    <text x="210" y="262" font-family="monospace, sans-serif" font-weight="900" font-size="44" fill="#06b6d4" text-anchor="middle">&lt;</text>
    <text x="256" y="260" font-family="monospace, sans-serif" font-weight="900" font-size="40" fill="#facc15" text-anchor="middle">/</text>
    <text x="302" y="262" font-family="monospace, sans-serif" font-weight="900" font-size="44" fill="#06b6d4" text-anchor="middle">&gt;</text>

    <!-- Headset Band -->
    <path d="M 155 235 C 135 210, 135 180, 170 170 C 220 160, 292 160, 342 170 C 377 180, 377 210, 357 235" fill="none" stroke="#06b6d4" stroke-width="10" stroke-linecap="round"/>
    
    <!-- Headset Ear Cushions -->
    <rect x="125" y="210" width="28" height="50" rx="14" fill="#312e81" stroke="#06b6d4" stroke-width="4"/>
    <rect x="359" y="210" width="28" height="50" rx="14" fill="#312e81" stroke="#06b6d4" stroke-width="4"/>

    <!-- Nose -->
    <polygon points="256,310 242,326 270,326" fill="#1e1b4b"/>
  </g>

  <!-- Glowing Star on Visor Corner -->
  <circle cx="340" cy="226" r="6" fill="#facc15"/>
</svg>
